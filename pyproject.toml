[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptos"
version = "0.2.0"
description = "Diabetic retinopathy grading on APTOS-2019: reproducible pipeline, measured confound analysis, external validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Senanur Çetin" }]

# The floor is deliberately low and the ceiling is left open: this is a
# research pipeline, not a library other code depends on. What matters is that
# `pip install -e .` gives a working tree, and that the *pure* parts (below)
# stay installable without torch so CI can run them on three Python versions.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything the GPU training path needs. Kept separate so the fast CI job and
# the preprocessing-only Colab path do not pull torch.
train = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0",
    "pillow>=10.0",
    "mlflow>=2.9",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
# Optional sink only. The project ran on BigQuery once and became
# unreproducible when that access was lost; it is never required again.
bigquery = [
    "google-cloud-bigquery>=3.13",
    "google-cloud-storage>=2.14",
    "db-dtypes>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
aptos = "aptos.pipeline:main"

[project.urls]
Repository = "https://github.com/senanurcetin/APTOS-2019-diabetic-retinopathy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pure` marks tests that need neither torch nor the dataset. The fast CI job
# runs `-m pure` on three Python versions; the full job runs everything once.
markers = [
    "pure: runs without torch or the dataset",
    "torch: needs torch installed",
    "data: needs the APTOS dataset on disk",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# aptos_2019.ipynb is excluded because it is known broken, not because its
# warnings are uninteresting: it calls APTOSDataset(use_crop=...), a parameter
# that does not exist; it uses pd and plt without importing either; and it has
# no training loop despite being the notebook the README points at. Linting it
# would report style problems in code that cannot run. It is scheduled for
# replacement, and this line should go with it.
exclude = ["aptos_2019.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection requires these calls in argument defaults;
# B008 exists for mutable defaults, which these are not.
extend-immutable-calls = [
    "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends", "fastapi.Body",
]

[tool.coverage.run]
source = ["aptos"]
omit = ["*/reporting/figures.py"]
